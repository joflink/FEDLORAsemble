[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fedlorasemble"
version = "1.0.0"
description = "FEDLORAsemble - Federerad träning med LoRA och Mixture of Experts"
license = "Apache-2.0"
authors = [
    {name = "FEDLORAsemble Team"},
]
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Flower för federerad träning
    "flwr[simulation]>=1.11.0",
    "flwr-datasets>=0.3.0",
    
    # Machine Learning bibliotek
    "torch>=2.0.0",
    "transformers>=4.47.1",
    "trl>=0.13.0",
    "peft>=0.14.0",
    "bitsandbytes>=0.45.0",
    "accelerate>=0.20.0",
    
    # Data och evaluering
    "datasets>=2.14.0",
    "evaluate>=0.4.0",
    "scipy>=1.13.0",
    "numpy>=1.21.0",
    "scikit-learn>=1.0.0",
    "pandas>=1.3.0",
    
    # Konfiguration och utilities
    "omegaconf>=2.3.0",
    "sentencepiece>=0.2.0",
    "tokenizers>=0.15.0",
    
    # Websökning och networking
    "duckduckgo-search>=3.0.0",
    "requests>=2.25.0",
    
    # Utveckling och debugging
    "tqdm>=4.60.0",
    "wandb>=0.15.0",  # Valfri för experiment tracking
    
    # Notebook-stöd
    "jupyter>=1.0.0",
    "ipython>=7.0.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0.0",
    "black>=22.0.0",
    "isort>=5.0.0",
    "flake8>=4.0.0",
    "mypy>=0.910",
    "pre-commit>=2.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "fedlorasemble"

[tool.flwr.app.components]
serverapp = "training.server_app:app"
clientapp = "training.client_app:app"

[tool.flwr.app.config.static]
# Dataset-konfiguration
dataset.name = "datasets/alpaca-gpt4"
dataset.train_split = "train"
dataset.validation_split = "validation"

# Federerad träningskonfiguration
num-server-rounds = 100
strategy.fraction-fit = 0.4
strategy.fraction-evaluate = 0.0

[tool.flwr.federations]
default = ""

[tool.flwr.app.config]
# Modellkonfiguration
model.name = "models/qwens/Qwen2.5-0.5B-Instruct"
model.quantization = 4
model.gradient-checkpointing = true

# LoRA-konfiguration
model.lora.peft-lora-r = 32
model.lora.peft-lora-alpha = 64
model.lora.lora-dropout = 0.05
model.lora.bias = "none"
model.lora.target-modules = ["q_proj", "v_proj", "k_proj", "o_proj"]

# Träningskonfiguration
train.save-every-round = 5
train.learning-rate-max = 5e-5
train.learning-rate-min = 1e-6
train.seq-length = 512

# Träningsargument
train.training-arguments.per-device-train-batch-size = 16
train.training-arguments.gradient-accumulation-steps = 1
train.training-arguments.logging-steps = 10
train.training-arguments.num-train-epochs = 3
train.training-arguments.max-steps = 20
train.training-arguments.save-steps = 1000
train.training-arguments.save-total-limit = 10
train.training-arguments.gradient-checkpointing = true
train.training-arguments.lr-scheduler-type = "cosine"
train.training-arguments.warmup-steps = 100
train.training-arguments.weight-decay = 0.01
train.training-arguments.fp16 = true
train.training-arguments.report-to = "none"

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["fedlorasemble"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
