# evals.yml
gsm8k:
  class: evals.prompt.base:CompletionBenchmark
  args:
    completion_fns: [tgi_router]
    dataset: hf:gsm8k/main:test          # Math‑LoRA
    metrics: [path:myevals/my_exact.py:MathExactMatch, latency_ms]

mmlu:
  class: evals.prompt.base:CompletionBenchmark
  args:
    completion_fns: [tgi_router]
    dataset: hf:mmlu/all               # General‑LoRA
    metrics: [accuracy, latency_ms]

arc_cot:
  class: evals.prompt.base:CompletionBenchmark
  args:
    completion_fns: [tgi_router]
    dataset: hf:open_arc_cot/full      # Reasoning‑LoRA
    metrics: [exact_match, latency_ms]

humaneval:
  class: evals.prompt.base:CompletionBenchmark
  args:
    completion_fns: [tgi_router]
    dataset: hf:evalplus_humaneval
    metrics: [pass@1, latency_ms]
